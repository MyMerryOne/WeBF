[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "webf"
version = "1.0.0"
description = "Web Forensic Capture Tool for EU court proceedings"
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.40.0",
    "requests>=2.31.0",
    "dnspython>=2.4.0",
    "python-whois>=0.9.4",
    "cryptography>=41.0.0",
    "warcio>=1.7.4",
    "jinja2>=3.1.2",
    "click>=8.1.7",
    "pyasn1>=0.5.1",
    "pyasn1-modules>=0.3.0",
]

[project.scripts]
webf = "webf:cli"

