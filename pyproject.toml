[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "webf"
version = "1.0.0"
description = "Web Capture and Verification Tool for documented technical review"
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.40.0",
    "requests>=2.31.0",
    "dnspython>=2.4.0",
    "python-whois>=0.9.4",
    "cryptography>=41.0.0",
    "warcio>=1.7.4",
    "jinja2>=3.1.2",
    "click>=8.1.7",
    "pyasn1>=0.5.1",
    "pyasn1-modules>=0.3.0",
]

[project.scripts]
webf = "webf:cli"

[tool.setuptools]
py-modules = ["webf"]

[tool.setuptools.packages.find]
include = ["capture*", "evidence*", "jurisdiction*", "packaging*"]

[project.optional-dependencies]
dev = [
    "build>=1.2.0",
    "mypy>=1.8.0",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"
lint.select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["capture", "evidence", "jurisdiction", "packaging"]

[tool.coverage.report]
show_missing = true

